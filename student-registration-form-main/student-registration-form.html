<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANITS Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            border: 2px solid #003366;
            background-color: #f9f9f9;
        }

        h2 {
            text-align: center;
            color: #003366;
            margin-top: 0;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
        }

        input[type="text"], 
        input[type="email"], 
        input[type="tel"], 
        select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .btn {
            background-color: #003366;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>ANITS Student Registration</h2>

    <form action="#">

        <div class="field">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" value="Toyaka Vedavyas" required>
        </div>

        <div class="field">
            <label for="roll">Roll Number:</label>
            <input type="text" id="roll" name="roll" value="A24126552188" required>
        </div>

        <div class="field">
            <label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option value="CSM" selected>CSM (AI & ML)</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="IT">IT</option>
            </select>
        </div>

        <div class="field">
            <label for="section">Section:</label>
            <select id="section" name="section">
                <option value="A">Section A</option>
                <option value="B">Section B</option>
                <option value="C">Section C</option>
                <option value="D" selected>Section D</option>
            </select>
        </div>

        <div class="field">
            <label for="year">Year:</label>
            <select id="year" name="year">
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3" selected>3rd Year</option>
                <option value="4">4th Year</option>
            </select>
        </div>

        <div class="field">
            <label for="email">College Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <button type="submit" class="btn">Register</button>

    </form>

</body>
</html>
